[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-sim"
version = "0.1.0"
description = "A reproducible, event-sourced basketball simulation and forecasting engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
tracking = [
    "torch>=2.4",
]
data = [
    "nba_api>=1.10,<2",
    "pypdf>=5,<7",
    "requests>=2.32,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
nba-sim = "nba_sim.cli:main"
nba-sim-web = "nba_sim.web:main"
nba-sim-data = "nba_sim.data_cli:main"
nba-sim-demo = "nba_sim.demo:main"

[tool.setuptools.package-data]
nba_sim = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
